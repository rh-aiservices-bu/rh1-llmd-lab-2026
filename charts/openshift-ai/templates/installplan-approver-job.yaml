{{- $namespace := "redhat-ods-operator" }}
{{- $subscriptionName := "rhods-operator" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installplan-approver
  namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installplan-approver
  namespace: {{ $namespace }}
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installplan-approver
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installplan-approver
subjects:
  - kind: ServiceAccount
    name: installplan-approver
    namespace: {{ $namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: installplan-approver
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: installplan-approver
      restartPolicy: OnFailure
      containers:
        - name: approver
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              SUBSCRIPTION_NAME="{{ $subscriptionName }}"
              NAMESPACE="{{ $namespace }}"
              MAX_RETRIES=60
              RETRY_INTERVAL=10

              # This hook re-runs on every Argo sync (including retries), so it must
              # only approve the initial install and never a later upgrade InstallPlan.
              STARTING_CSV=$(oc get subscription ${SUBSCRIPTION_NAME} -n ${NAMESPACE} -o jsonpath='{.spec.startingCSV}' 2>/dev/null || true)

              echo "Waiting for InstallPlan for subscription ${SUBSCRIPTION_NAME} ${STARTING_CSV}..."

              for i in $(seq 1 $MAX_RETRIES); do
                INSTALLED_CSV=$(oc get subscription ${SUBSCRIPTION_NAME} -n ${NAMESPACE} -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [ -n "$INSTALLED_CSV" ]; then
                  echo "${INSTALLED_CSV} is already installed; not approving any further InstallPlans."
                  exit 0
                fi

                if [ -n "$STARTING_CSV" ]; then
                  INSTALL_PLAN=$(oc get installplan -n ${NAMESPACE} -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.clusterServiceVersionNames[*]}{"\n"}{end}' 2>/dev/null \
                    | awk -v csv="${STARTING_CSV}" '{ for (j = 2; j <= NF; j++) if ($j == csv) { print $1; exit } }')
                else
                  INSTALL_PLAN=$(oc get subscription ${SUBSCRIPTION_NAME} -n ${NAMESPACE} -o jsonpath='{.status.installplan.name}' 2>/dev/null || true)
                fi

                if [ -n "$INSTALL_PLAN" ]; then
                  echo "Found InstallPlan: ${INSTALL_PLAN}"

                  APPROVED=$(oc get installplan ${INSTALL_PLAN} -n ${NAMESPACE} -o jsonpath='{.spec.approved}')

                  if [ "$APPROVED" == "true" ]; then
                    echo "InstallPlan ${INSTALL_PLAN} is already approved."
                    exit 0
                  fi

                  echo "Approving InstallPlan ${INSTALL_PLAN}..."
                  oc patch installplan ${INSTALL_PLAN} -n ${NAMESPACE} --type merge --patch '{"spec":{"approved":true}}'
                  echo "InstallPlan ${INSTALL_PLAN} approved successfully."
                  exit 0
                fi

                echo "Attempt $i/$MAX_RETRIES: InstallPlan not found yet. Retrying in ${RETRY_INTERVAL}s..."
                sleep $RETRY_INTERVAL
              done

              echo "ERROR: Timed out waiting for InstallPlan"
              exit 1
