# RHOAI operator. The catalog item overrides these per stage
# (e.g. dev: channel stable-3.5, startingCSV rhods-operator.3.5.1).
channel: fast-3.x
startingCSV: rhods-operator.3.2.0

# Red Hat build of Leader Worker Set operator, required by RHOAI 3.3+ for LLMInferenceService.
leaderWorkerSet:
  enabled: false
  channel: stable-v1.0

llmD:
  namespace:
    create: true
    scrape: true

components:
  kserve:
    nim:
      managementState: Removed
    rawDeploymentServiceConfig: Headless
    managementState: Managed
  modelregistry:
    registriesNamespace: rhoai-model-registries
    managementState: Managed
  feastoperator:
    managementState: Removed
  trustyai:
    eval:
      lmeval:
        permitCodeExecution: deny
        permitOnline: deny
    managementState: Managed
  aipipelines:
    argoWorkflowsControllers:
      managementState: Managed
    managementState: Managed
  ray:
    managementState: Removed
  kueue:
    defaultClusterQueueName: default
    defaultLocalQueueName: default
    managementState: Removed
  workbenches:
    workbenchNamespace: rhods-notebooks
    managementState: Managed
  dashboard:
    managementState: Managed
  llamastackoperator:
    managementState: Removed
  trainingoperator:
    managementState: Removed
